<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | GeigerTech</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">GeigerTech</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="reviews.html">Reviews</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="contact-section">
            <div class="container">
                <h1 class="page-title">Get in Touch</h1>
                <p class="meta-info">Have a device review suggestion, technical inquiry, or feedback? Drop a message below.</p>

                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject:</label>
                        <input type="text" id="subject" placeholder="What is this regarding?" required>
                    </div>

                    <div class="form-group"><br>
                        <label for="message">Message:</label>
                        <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div><br>

                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </section>

        <!-- Navigation Section -->
        <section class="pagination-section">
            <div class="container pagination-wrapper">
                <a href="reviews_3.html" class="btn-secondary">&larr; Back to Windows 11 Review</a>
                <a href="about.html" class="btn-primary">About GeigerTech &rarr;</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 GeigerTech. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
